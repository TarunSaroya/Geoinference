[project]
name = "geoinference"
version = "0.1.0"
description = "Explainable AI geolocation system using computer vision"
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true

